<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dark squad — files</title>
<meta name="description" content="files dark squad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  :root{
    --bg:#0a0505;
    --bg-soft:#120808;
    --card:#1c0a0a;
    --border:rgba(248,113,113,.15);
    --border-hi:rgba(248,113,113,.6);
    --text:#fcf1f1;
    --muted:#b89d9d;
    --p1:#ef4444;
    --p2:#f87171;
    --p3:#fecaca;
    --grad:linear-gradient(135deg,#ef4444 0%,#f87171 50%,#fecaca 100%);
    --radius:18px;
  }

  html{scroll-behavior:smooth}

  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
    min-height:100svh;
  }

  h1,h2,h3,.logo,.btn{font-family:'Space Grotesk',system-ui,sans-serif}

  ::selection{background:rgba(248,113,113,.35);color:#fff}

  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-track{background:#0a0505}
  ::-webkit-scrollbar-thumb{background:linear-gradient(#ef4444,#fecaca);border-radius:10px;border:3px solid #0a0505}

  .nav{
    position:fixed;top:0;left:0;right:0;z-index:200;
    padding:20px 0;transition:all .35s ease;
  }
  .nav.scrolled{
    padding:12px 0;
    background:rgba(10,5,5,.85);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{
    max-width:1240px;margin:0 auto;padding:0 24px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
  }
  .logo{
    font-size:20px;font-weight:700;letter-spacing:.06em;
    text-decoration:none;white-space:nowrap;
    background:linear-gradient(135deg,#ef4444 0%,#f87171 50%,#fecaca 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .logo span{
    background:linear-gradient(135deg,#f87171,#fecaca);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .nav-links{display:flex;align-items:center;gap:34px}
  .nav-links a{
    position:relative;color:var(--muted);text-decoration:none;
    font-size:14.5px;font-weight:500;letter-spacing:.02em;transition:color .25s;
  }
  .nav-links a::after{
    content:'';position:absolute;left:0;bottom:-6px;height:2px;width:0;
    background:var(--grad);border-radius:2px;transition:width .3s ease;
  }
  .nav-links a:hover{color:#fff}
  .nav-links a:hover::after{width:100%}

  .burger{
    display:none;background:none;border:0;cursor:pointer;
    width:40px;height:40px;flex-direction:column;justify-content:center;
    align-items:center;gap:5px;border-radius:10px;
  }
  .burger span{
    display:block;width:22px;height:2px;background:#fff;border-radius:2px;
    transition:.3s;
  }
  .burger.active span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .burger.active span:nth-child(2){opacity:0}
  .burger.active span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

  .page{
    position:relative;
    padding:160px 24px 80px;
    min-height:100svh;
    overflow:hidden;
  }
  .grid-bg{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(248,113,113,.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(248,113,113,.07) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 10%,transparent 78%);
    mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 10%,transparent 78%);
    animation:gridDrift 22s linear infinite;
    pointer-events:none;
  }
  @keyframes gridDrift{
    from{background-position:0 0,0 0}
    to{background-position:64px 64px,64px 64px}
  }
  .glow{
    position:absolute;border-radius:50%;filter:blur(120px);
    opacity:.45;pointer-events:none;
  }
  .glow.g1{width:520px;height:520px;background:#b91c1c;top:-140px;left:-120px;animation:float1 14s ease-in-out infinite}
  .glow.g2{width:460px;height:460px;background:#ef4444;bottom:-160px;right:-100px;animation:float2 17s ease-in-out infinite}
  @keyframes float1{50%{transform:translate(70px,60px) scale(1.12)}}
  @keyframes float2{50%{transform:translate(-60px,-50px) scale(1.08)}}

  .page-inner{position:relative;z-index:2;max-width:1100px;margin:0 auto;text-align:center}

  .page-title{
    font-size:clamp(2.6rem,10vw,6rem);
    font-weight:700;line-height:.95;letter-spacing:-.04em;
    background:linear-gradient(100deg,#b91c1c 0%,#ef4444 25%,#f87171 50%,#fca5a5 75%,#fecaca 100%);
    background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 7s ease-in-out infinite;
    filter:drop-shadow(0 0 60px rgba(239,68,68,.55));
    margin-bottom:20px;
  }
  @keyframes shine{
    0%,100%{background-position:0% 50%}
    50%{background-position:100% 50%}
  }

  .page-sub{
    color:#f87171;
    font-size:16.5px;
    margin-bottom:52px;
    font-weight:500;
  }
  .page-sub b{
    color:#fecaca;
    font-weight:700;
  }

  .files-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
    text-align:left;
  }

  .file-card{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:28px 24px;
    border-radius:16px;
    border:1px solid var(--border);
    background:var(--card);
    text-decoration:none;
    color:var(--text);
    overflow:hidden;
    transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s,background .3s;
  }
  .file-card::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 50% 0%,rgba(248,113,113,.20),transparent 65%);
    opacity:0;transition:opacity .35s;pointer-events:none;
  }
  .file-card:hover{
    transform:translateY(-6px);
    border-color:var(--border-hi);
    background:rgba(239,68,68,.08);
    box-shadow:0 20px 50px -20px rgba(239,68,68,.75);
  }
  .file-card:hover::before{opacity:1}

  .file-card > *{position:relative;z-index:2}

  .file-name{
    font-family:'Space Grotesk',system-ui,sans-serif;
    font-size:18px;font-weight:700;letter-spacing:-.01em;
    background:linear-gradient(135deg,#f87171 0%,#fca5a5 50%,#fecaca 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  .file-desc{
    font-size:14px;color:var(--muted);
    line-height:1.5;
  }

  .file-pass{
    margin-top:auto;
    padding-top:14px;
    border-top:1px solid rgba(248,113,113,.12);
    font-size:13px;
    color:#b89d9d;
    display:flex;align-items:center;gap:8px;
    flex-wrap:wrap;
  }
  .file-pass span{
    padding:3px 10px;
    border-radius:6px;
    background:rgba(239,68,68,.16);
    border:1px solid rgba(248,113,113,.28);
    color:#fecaca;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    letter-spacing:.02em;
    font-size:12.5px;
  }

  .back-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    padding:15px 34px;border-radius:999px;
    font-size:15px;font-weight:600;letter-spacing:.02em;
    text-decoration:none;cursor:pointer;
    background:rgba(248,113,113,.05);
    color:#fecaca;
    border:1px solid rgba(248,113,113,.35);
    transition:transform .25s ease,box-shadow .3s ease,background .3s,border-color .3s;
    font-family:'Space Grotesk',sans-serif;
    margin-top:56px;
  }
  .back-btn:hover{
    transform:translateY(-3px);
    background:rgba(248,113,113,.14);
    border-color:rgba(248,113,113,.7);
    box-shadow:0 14px 40px -14px rgba(239,68,68,.8);
  }

  .reveal{
    opacity:0;transform:translateY(34px);
    transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);
  }
  .reveal.visible{opacity:1;transform:none}

  @media (max-width:900px){
    .files-grid{grid-template-columns:repeat(2,1fr)}
  }

  @media (max-width:768px){
    .burger{display:flex}
    .nav-links{
      position:fixed;inset:0 0 0 auto;width:min(78vw,320px);
      flex-direction:column;justify-content:center;gap:34px;
      background:rgba(18,8,8,.98);
      backdrop-filter:blur(20px);
      border-left:1px solid var(--border);
      transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);
      z-index:150;
    }
    .nav-links.open{transform:translateX(0)}
    .nav-links a{font-size:20px;color:#fff}
    .burger{z-index:200}
    .page{padding:130px 20px 60px}
  }

  @media (max-width:520px){
    .files-grid{grid-template-columns:1fr}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
    .reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="nav-inner">
    <a href="https://thedarksquad.github.io/site/" class="logo">dark <span>squad</span></a>
    <nav class="nav-links" id="navLinks">
      <a href="https://thedarksquad.github.io/site/#admins">Админы</a>
      <a href="https://thedarksquad.github.io/site/#join">Вступить</a>
      <a href="files.html">Файлы</a>
    </nav>
    <button class="burger" id="burger" aria-label="Открыть меню">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main class="page">
  <div class="grid-bg"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div class="page-inner">
    <h1 class="page-title">Файлы</h1>
    <p class="page-sub">Пароли от раток: <b>darksquad</b></p>

    <div class="files-grid">

      <a href="https://www.mediafire.com/file/andhpz4f1wex6la/pidorat+1.2.rar/file" target="_blank" rel="noopener" class="file-card reveal">
        <div class="file-name">PidoRat 1.2</div>
        <div class="file-desc">Имбовая ратка</div>
        <div class="file-pass">Пароль: <span>darksquad</span></div>
      </a>

      <a href="https://www.mediafire.com/file/fuksrpgkcxuhqpz/XWorm_7.4.rar/file" target="_blank" rel="noopener" class="file-card reveal">
        <div class="file-name">Xworm 7.4</div>
        <div class="file-desc">Не знаю вроде норм ратка не юзал</div>
        <div class="file-pass">Пароль: <span>darksquad</span></div>
      </a>

      <a href="https://www.mediafire.com/file/r04fv3qk3gh7ulz/SheetRat.rar/file" target="_blank" rel="noopener" class="file-card reveal">
        <div class="file-name">Sheet rat</div>
        <div class="file-desc">Норм ратка но пидорат получше будет</div>
        <div class="file-pass">Пароль: <span>darksquad</span></div>
      </a>

    </div>

    <a href="https://thedarksquad.github.io/site/" class="back-btn">← На главную</a>
  </div>
</main>

<script>
  const nav = document.getElementById('nav');
  const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 40);
  onScroll();
  window.addEventListener('scroll', onScroll, { passive: true });

  const burger = document.getElementById('burger');
  const navLinks = document.getElementById('navLinks');

  burger.addEventListener('click', () => {
    burger.classList.toggle('active');
    navLinks.classList.toggle('open');
    document.body.style.overflow = navLinks.classList.contains('open') ? 'hidden' : '';
  });

  navLinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      burger.classList.remove('active');
      navLinks.classList.remove('open');
      document.body.style.overflow = '';
    });
  });

  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 90);
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });

  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
</script>

</body>
</html>
